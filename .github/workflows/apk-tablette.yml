# Construit l'APK de la tablette Bêta à chaque modification de beta-tablette/.
# Le fichier se télécharge ensuite dans l'onglet Actions > le dernier « APK tablette Bêta » > Artifacts.
name: APK tablette Bêta

on:
  push:
    paths:
      - "beta-tablette/**"
      - ".github/workflows/apk-tablette.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beta-tablette
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: beta-tablette-apk
          path: beta-tablette/app/build/outputs/apk/release/*.apk
