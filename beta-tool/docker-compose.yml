# Bêta Tool + Bêta Work (ONLYOFFICE Docs) + Coffre (Vaultwarden)
# Réglages dans le fichier .env (secret, services optionnels, adresses…)
services:
  beta-tool:
    build: .
    container_name: beta-tool
    ports:
      - "8080:8080"
    volumes:
      # Remplace les chemins de gauche par tes dossiers (Synology : /volume1/… — QNAP : /share/…
      # — sans NAS, n'importe quel dossier de l'ordinateur, ex. ./donnees/videos)
      - /volume1/video/YouTube:/downloads            # Téléchargeur
      - /volume1/documents/Conversions:/converted    # Convertisseur, Compresseur vidéo, Studio Image
      - /volume1/documents/PDF:/pdf                  # Studio PDF (bouton « Sur le NAS »)
      - /volume1/documents/Decompresses:/extracted   # Décompresseur
      - /volume1/documents/BetaWork:/documents       # Bêta Work
      - /volume1/photo:/photos                       # Album photo
      - /volume1/documents/Recus:/depots             # Bêta Drop : fichiers que l'on t'envoie
      - /volume1/docker/beta-tool/data:/data         # Comptes, réglages, notes, mises à jour, modèles IA…
      - ./static/brand:/app/static/brand             # Icône et bannière
      # Accès sécurisé (profil « https ») : pour proposer le certificat de la maison au téléchargement
      # - /volume1/docker/beta-tool/caddy:/caddy:ro
      # Sauvegardes automatiques : un AUTRE disque (USB, second volume…)
      # - /volumeUSB1/usbshare/BetaTool:/backup
      # Autres dossiers à afficher dans Fichiers et la Médiathèque (voir EXTRA_ROOTS plus bas)
      # - /volume1/music:/media/musique
      # - /volume1/video/Films:/media/films
      # Optionnel : fichiers temporaires sur le disque plutôt que dans le conteneur
      # - /volume1/docker/beta-tool/work:/work
    environment:
      - TZ=Europe/Paris           # fuseau horaire (heure des sauvegardes)
      - WORKERS=2                 # téléchargements en parallèle
      - CONVERT_WORKERS=2         # conversions en parallèle
      - MAX_UPLOAD_GB=20          # taille max d'un fichier envoyé
      - MAX_EXTRACT_GB=50         # taille max d'une archive une fois décompressée
      - JOB_TTL_HOURS=24          # durée de conservation des résultats temporaires
      - APP_PASSWORD=${APP_PASSWORD:-}
      - STORAGE_NAME=${STORAGE_NAME:-NAS}
      - EXTRA_ROOTS=${EXTRA_ROOTS:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - VAULT_URL=${VAULT_URL:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - VPN_PASSWORD=${VPN_PASSWORD:-}            # même mot de passe que wg-easy (outil VPN)
      - MS_CLIENT_ID=${MS_CLIENT_ID:-}            # connexion Microsoft (Outlook) : aussi réglable dans Réglages
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}    # connexion Google Agenda : aussi réglable dans Réglages
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # - PAPERS_DIR=/documents/Paperasse          # dossier de Paperasse (par défaut dans Documents)
    # user: "1026:100"            # optionnel : propriétaire des fichiers (voir `id` sur le NAS)
    restart: unless-stopped

  # Bêta Work : éditeur ONLYOFFICE Docs (≈ 2 à 4 Go de RAM). Activé par « work » dans COMPOSE_PROFILES (.env)
  onlyoffice:
    image: onlyoffice/documentserver:8.3.3
    container_name: beta-work
    profiles: ["work"]
    ports:
      - "8081:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ALLOW_PRIVATE_IP_ADDRESS=true   # autorise ONLYOFFICE à joindre Bêta Tool sur le réseau local
    volumes:
      - /volume1/docker/beta-tool/onlyoffice:/var/www/onlyoffice/Data
    restart: unless-stopped

  # Coffre : gestionnaire de mots de passe Vaultwarden (≈ 50 Mo de RAM). Activé par « vault » dans COMPOSE_PROFILES
  # Il exige une adresse en HTTPS (voir le README) pour fonctionner dans le navigateur et les applis.
  vaultwarden:
    image: vaultwarden/server:1.32.7
    container_name: vaultwarden
    profiles: ["vault"]
    ports:
      - "8082:80"
    environment:
      - DOMAIN=${VAULT_URL:-}
      - SIGNUPS_ALLOWED=${VAULT_SIGNUPS:-true}
      - ADMIN_TOKEN=${VAULT_ADMIN_TOKEN:-}
      - TZ=Europe/Paris
    volumes:
      - /volume1/docker/beta-tool/data/vault:/data
    restart: unless-stopped

  # VPN : WireGuard avec wg-easy (≈ 30 Mo de RAM). Activé par « vpn » dans COMPOSE_PROFILES.
  # Ouvre le port UDP 51820 de ta box vers le NAS. Synology : installe d'abord le module WireGuard (voir le README).
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:13
    container_name: wg-easy
    profiles: ["vpn"]
    environment:
      - WG_HOST=${VPN_HOST:-}
      - PASSWORD=${VPN_PASSWORD:-}
      - WG_DEFAULT_DNS=1.1.1.1
      - LANG=fr
    volumes:
      - /volume1/docker/beta-tool/data/vpn:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  # Accès sécurisé à la maison (https://) : Caddy avec SES PROPRES certificats, sans rien ouvrir sur Internet.
  # Activé par « https » dans COMPOSE_PROFILES. Adresse : https://<BETA_HOST> (par défaut le nom du NAS en .local).
  # Chaque appareil doit faire confiance une fois au certificat de la maison : Réglages › Accès sécurisé.
  caddy:
    image: caddy:2.8.4
    container_name: beta-https
    profiles: ["https"]
    ports:
      - "8443:443"
    environment:
      - BETA_HOST=${BETA_HOST:-beta.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /volume1/docker/beta-tool/caddy:/data          # certificat de la maison (à monter aussi dans beta-tool, voir plus bas)
    restart: unless-stopped

  # Tailscale : adresse https://beta.<ton-réseau>.ts.net avec un vrai certificat, joignable seulement par TES appareils
  # (à la maison et dehors), sans ouvrir de port. Activé par « tailscale » dans COMPOSE_PROFILES ; clé TS_AUTHKEY
  # à créer sur login.tailscale.com (Settings › Keys). Active « MagicDNS » et « HTTPS Certificates » dans DNS.
  tailscale:
    image: tailscale/tailscale:v1.76.6
    container_name: beta-tailscale
    profiles: ["tailscale"]
    hostname: beta
    network_mode: host
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=beta
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/tailscale-serve.json
      - TS_USERSPACE=false
    volumes:
      - /volume1/docker/beta-tool/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/tailscale-serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
