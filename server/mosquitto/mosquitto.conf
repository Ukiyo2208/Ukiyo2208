# Broker MQTT de Bêta home (Zigbee2MQTT, Tasmota, ESPHome, LinknLink…), réseau local uniquement.
listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest stdout
# Sans mot de passe tant que le port 1883 n'est pas ouvert sur internet (il ne doit pas l'être).
# Pour en mettre un : docker exec -it mosquitto mosquitto_passwd -c /mosquitto/config/passwd beta
# puis remplacer la ligne ci-dessous par « allow_anonymous false » + « password_file /mosquitto/config/passwd ».
allow_anonymous true
