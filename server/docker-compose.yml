# Serveur Bêta pour NAS UGREEN (UGOS Pro › Docker › Projet › Créer)
# Placez ce fichier dans le dossier « server » de Bêta OS, puis lancez le projet.
services:
  beta-os:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: beta-os
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - BETA_KEY=changez-moi-par-une-longue-phrase   # même clé dans Bêta OS › Connexions
      - BACKUP_KEEP=30                                # nombre de sauvegardes gardées
      - TZ=Europe/Paris
    volumes:
      - ./data:/data                                  # sauvegardes, journal, données
