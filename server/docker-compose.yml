# Bêta home pour NAS (UGREEN, Synology…), Raspberry Pi ou PC — UGOS Pro › Docker › Projet › Créer.
# Placez ce fichier dans le dossier « server » de Bêta home, puis lancez le projet.
#
# Réseau « hôte » (network_mode: host) : indispensable pour que la découverte (caméras ONVIF, Bonjour,
# UPnP) et le pont HomeKit des caméras voient le réseau de la maison. Bêta home : http://IP-du-NAS:8090
services:
  beta-home:
    image: ghcr.io/ukiyo2208/beta-home:latest        # image prête (construite par GitHub) ; « docker compose build » la reconstruit en local
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: beta-home
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=8090
      - BETA_KEY=changez-moi-par-une-longue-phrase   # même clé dans Bêta home › Connexions
      - BACKUP_KEEP=30                                # nombre de sauvegardes gardées
      - GO2RTC_URL=http://127.0.0.1:1984             # go2rtc ci-dessous
      - TZ=Europe/Paris
      # - WATCHTOWER_TOKEN=une-autre-longue-phrase   # mises à jour depuis Bêta home (service watchtower ci-dessous)
    volumes:
      - ./data:/data                                  # sauvegardes, journal, caméras, config go2rtc
      # - /mnt/@usb/sdb1/beta-backup:/backup          # clé USB : sauvegardes de la nuit copiées dans /backup (Paramètres › Sauvegarde)
      # - /volume1/Photos:/photos:ro                 # cadre photo des tablettes (Outils › Cadre photo : dossier /photos)

  # Caméras : direct vidéo pour Bêta home + pont HomeKit (app Maison) pour les seules caméras.
  # Sa configuration (data/go2rtc.yaml) est écrite par Bêta home ; ne la modifiez pas à la main.
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./data/go2rtc.yaml:/config/go2rtc.yaml

  # Broker MQTT : utilisé par Zigbee2MQTT (et Tasmota, ESPHome, LinknLink si vous le souhaitez).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto:/mosquitto/data

  # Zigbee2MQTT : décommentez quand la clé Zigbee USB est branchée sur le NAS.
  # Interface : http://IP-du-NAS:8080 · Bêta home › Marques › Zigbee2MQTT (broker : IP du NAS, port 1883).
  # zigbee2mqtt:
  #   image: koenkk/zigbee2mqtt:latest
  #   container_name: zigbee2mqtt
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     - TZ=Europe/Paris
  #     - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=mqtt://127.0.0.1:1883
  #     - ZIGBEE2MQTT_CONFIG_FRONTEND_PORT=8080
  #   volumes:
  #     - ./data/zigbee2mqtt:/app/data
  #   devices:
  #     - /dev/ttyUSB0:/dev/ttyACM0   # adaptez au nom de votre clé (ls /dev/serial/by-id/)

  # Matter (contrôleur) : pilote en local les appareils Matter (Aqara Hub M3, Eve, Nanoleaf, IKEA…).
  # Bêta home › Marques › Matter (adresse : IP-du-NAS:5580). Le NAS doit avoir l'IPv6 activée sur le réseau local.
  # matter-server:
  #   image: ghcr.io/home-assistant-libs/python-matter-server:stable
  #   container_name: matter-server
  #   restart: unless-stopped
  #   network_mode: host
  #   security_opt:
  #     - apparmor:unconfined
  #   command: --storage-path /data --paa-root-cert-dir /data/credentials
  #   volumes:
  #     - ./data/matter-server:/data

  # Music Assistant (serveur seul, sans Home Assistant) : http://IP-du-NAS:8095
  # Bêta home › Marques › Music Assistant (adresse : IP-du-NAS:8095).
  # music-assistant:
  #   image: ghcr.io/music-assistant/server:latest
  #   container_name: music-assistant
  #   restart: unless-stopped
  #   network_mode: host
  #   security_opt:
  #     - apparmor:unconfined
  #   cap_add:
  #     - SYS_ADMIN
  #     - DAC_READ_SEARCH
  #   volumes:
  #     - ./data/music-assistant:/data

  # ntfy (option) : votre propre serveur de notifications sur le NAS, au lieu de ntfy.sh.
  # Bêta home › Paramètres › Notifs : serveur ntfy = http://IP-du-NAS:8091. Hors de la maison, les téléphones
  # doivent pouvoir joindre le NAS (VPN, accès à distance UGREEN, Tailscale…).
  # ntfy:
  #   image: binwiederhier/ntfy:latest
  #   container_name: ntfy
  #   restart: unless-stopped
  #   network_mode: host
  #   command: serve
  #   environment:
  #     - TZ=Europe/Paris
  #     - NTFY_BASE_URL=http://IP-du-NAS:8091
  #     - NTFY_LISTEN_HTTP=:8091
  #     - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh          # réveil des iPhone : seul un identifiant passe par ntfy.sh
  #     - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
  #     - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments   # photos de la sonnette
  #   volumes:
  #     - ./data/ntfy:/var/cache/ntfy

  # Ponts Matter (Alexa, Google Home) et HomeKit (app Maison d'Apple, Siri) : les appareils choisis dans
  # Bêta home › Connexions › Alexa et Maison. Sans Home Assistant ni abonnement. IPv6 du NAS activée pour Matter.
  # Les codes d'appairage s'affichent dans Bêta home (et dans le journal du conteneur).
  # matter-bridge:
  #   image: ghcr.io/ukiyo2208/beta-home-bridge:latest
  #   build:
  #     context: ../bridge
  #   container_name: beta-matter-bridge
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     - BETA_URL=http://127.0.0.1:8090
  #     - BETA_KEY=changez-moi-par-une-longue-phrase   # la même que pour beta-home
  #     - BRIDGE_PORT=5540
  #     - HOMEKIT_PORT=51826                          # pont Maison (mettez HOMEKIT=off pour le couper)
  #     - TZ=Europe/Paris
  #   volumes:
  #     - ./data/matter-bridge:/data                   # appairages (ne pas supprimer)

  # Accès à distance sécurisé avec Tailscale (gratuit) : Bêta home, OwnTracks et les notifications marchent hors de la maison
  # sans ouvrir la box, et en https (https://beta-home.<votre-tailnet>.ts.net) — utile aussi pour Spotify, Netatmo, SmartThings.
  # 1. admin.tailscale.com › Settings › Keys › « Generate auth key » ; 2. activez HTTPS (DNS › HTTPS Certificates) ;
  # 3. installez l'appli Tailscale sur les téléphones avec le même compte.
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   container_name: tailscale
  #   restart: unless-stopped
  #   network_mode: host
  #   cap_add: [NET_ADMIN, NET_RAW]
  #   devices:
  #     - /dev/net/tun:/dev/net/tun
  #   environment:
  #     - TS_AUTHKEY=tskey-auth-xxxxxxxx
  #     - TS_HOSTNAME=beta-home
  #     - TS_STATE_DIR=/var/lib/tailscale
  #     - TS_SERVE_CONFIG=/config/serve.json         # https://beta-home.<tailnet>.ts.net → Bêta home (port 8090)
  #   volumes:
  #     - ./data/tailscale:/var/lib/tailscale
  #     - ./tailscale:/config

  # Mises à jour depuis Bêta home (Paramètres › Mises à jour) : Watchtower télécharge la nouvelle image et redémarre.
  # Mettez la même phrase dans WATCHTOWER_TOKEN ici et dans le service beta-home.
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: watchtower
  #   restart: unless-stopped
  #   ports:
  #     - "8092:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - WATCHTOWER_HTTP_API_UPDATE=true
  #     - WATCHTOWER_HTTP_API_TOKEN=une-autre-longue-phrase
  #     - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
  #     - WATCHTOWER_CLEANUP=true
  #   command: beta-home beta-matter-bridge
