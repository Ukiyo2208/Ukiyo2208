# Copie ce fichier en « config.yaml » (même dossier) et adapte-le.

# En dessous de ce score de reconnaissance du visage (similarité SFace envoyée par la tablette),
# la personne est traitée comme inconnue. Même personne ≈ 0,6 à 0,9 ; quelqu'un d'autre ≈ 0,2.
seuil_confiance: 0.4

# Les noms doivent être identiques à ceux envoyés par la tablette.
personnes:
  bastien:
    role: admin
    companion: person.bastien # app Home Assistant Companion : savoir si tu es à la maison
    surnoms: [bast] # autres réponses possibles à « C'est pour qui ? »
    mail:
      serveur: imap.gmail.com
      utilisateur: ton.adresse@gmail.com
      mot_de_passe_env: MAIL_BASTIEN_PASSWORD # nom de la variable dans .env
  # Chaque personne de la maison, avec l'entité person.xxx de son app Companion :
  # lea:
  #   role: adulte
  #   companion: person.lea

# Ce que chaque rôle peut faire : domotique, mails, questions, automatisations
roles:
  admin: [domotique, mails, questions, automatisations]
  adulte: [domotique, mails, questions]
  enfant: [domotique, questions]
  # Sans visage : ce qui ne dépend pas de la personne. La caméra ne s'allume que pour le reste
  # (mails, automatisations...). Mets [] pour que Bêta regarde à chaque demande.
  inconnu: [domotique, questions]

# ------------------------------------------------------------------ Présence
# Pour une demande personnelle (mails…), si une seule personne connue a été vue récemment
# à l'étage de la tablette, Bêta sait que c'est elle : pas de caméra, pas de question.
maison:
  validite_minutes: 15 # au-delà, une position vue par les caméras n'est plus prise en compte
  # Chaque pièce appartient à une zone (un étage). La pièce de la tablette (salon) doit y figurer.
  zones:
    rez-de-chaussee: [salon, sejour, entree, cuisine]
    etage: [couloir-etage, chambre, bureau]
    grenier: [grenier] # pas de caméra : quelqu'un au grenier est « à la maison, vu nulle part »
    exterieur: [jardin, cour, sonnette]

# Caméras Reolink, telles qu'elles apparaissent dans Home Assistant (Paramètres > Entités).
# camera : de préférence le flux « Clair » (pleine résolution), à activer s'il est désactivé.
# detection : le capteur « Personne » de la caméra.
cameras:
  - { camera: camera.salon_clair, detection: binary_sensor.salon_personne, piece: salon }
  - { camera: camera.sejour_clair, detection: binary_sensor.sejour_personne, piece: sejour }
  - { camera: camera.entree_clair, detection: binary_sensor.entree_personne, piece: entree }
  - { camera: camera.couloir_etage_clair, detection: binary_sensor.couloir_etage_personne, piece: couloir-etage }
  - { camera: camera.jardin_1_clair, detection: binary_sensor.jardin_1_personne, piece: jardin }
  - { camera: camera.jardin_2_clair, detection: binary_sensor.jardin_2_personne, piece: jardin }
  - { camera: camera.cour_clair, detection: binary_sensor.cour_personne, piece: cour }
  - { camera: camera.sonnette_clair, detection: binary_sensor.sonnette_personne, piece: sonnette }

# Types d'appareils que Bêta peut lister et utiliser dans les automatisations
domaines_exposes:
  - light
  - switch
  - cover
  - climate
  - fan
  - media_player
  - lock
  - scene
  - sensor
  - binary_sensor
  - input_boolean
  - vacuum

# true : l'IA web reçoit aussi le nom des appareils (« Lampe chevet »), plus précis.
# false : seulement le type et la pièce.
envoyer_noms_appareils: true
