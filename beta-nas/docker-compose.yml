# Bêta IA : toute la partie technique, sur le NAS.
# La tablette n'envoie que l'audio de la commande + le nom de la personne reconnue.

name: beta-nas # nom fixe : le réseau « beta-nas_default » est toujours le même

services:
  # Domotique, automatisations, musique (via Music Assistant)
  # Installé seulement si COMPOSE_PROFILES=homeassistant dans .env. Si tu as déjà ton propre
  # Home Assistant, laisse COMPOSE_PROFILES vide et mets son adresse dans HA_URL.
  homeassistant:
    profiles: ["homeassistant"]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host # nécessaire pour découvrir les appareils du réseau
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Paris}
    restart: unless-stopped

  # Parole -> texte
  whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: beta-whisper
    command: --model ${WHISPER_MODEL:-small-int8} --language fr
    ports:
      - "127.0.0.1:10300:10300" # accessible seulement depuis le NAS (Home Assistant inclus)
    volumes:
      - ./data/whisper:/data
    restart: unless-stopped

  # Texte -> voix
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: beta-piper
    command: --voice ${PIPER_VOICE:-fr_FR-siwis-medium}
    ports:
      - "127.0.0.1:10200:10200"
    volumes:
      - ./data/piper:/data
    restart: unless-stopped

  # Petit LLM local (tri des demandes que Home Assistant ne comprend pas)
  ollama:
    image: ollama/ollama:latest
    container_name: beta-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped

  # Qui est où : reconnaît les visages quand une caméra Reolink détecte quelqu'un
  presence:
    build: ./presence
    container_name: beta-presence
    env_file: .env
    environment:
      - BETA_CONFIG=/config/config.yaml
    ports:
      - "8801:8801" # page /docs pour enregistrer un visage depuis une caméra
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
      - ./data/presence:/data # base des visages (empreintes uniquement, aucune image)
    restart: unless-stopped

  # Le cerveau : reçoit les demandes de la tablette et choisit qui les traite
  beta:
    build: ./beta
    container_name: beta
    env_file: .env
    environment:
      - BETA_CONFIG=/config/config.yaml
      - WHISPER_HOST=whisper
      - PIPER_HOST=piper
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "8800:8800" # la tablette appelle http://IP_DU_NAS:8800
    extra_hosts:
      - "host.docker.internal:host-gateway" # pour joindre Home Assistant (réseau host)
    volumes:
      - ./config:/config:ro
      - ./data/beta:/data # ce que Bêta enregistre (appareils partagés avec Alexa…)
      - ${SAUVEGARDE_DOSSIER:-./data/sauvegardes}:/sauvegardes:ro # état de la sauvegarde (tableau de bord, alertes)
    depends_on:
      - whisper
      - piper
      - ollama
      - presence
    restart: unless-stopped

  # Ancien tri des documents, remplacé par Paperasse (Bêta Tool › Paperasse › Sur le NAS). Gardé de côté :
  # COMPOSE_PROFILES=tri-ancien et TRI_URL=http://trieur:8802 dans .env pour le relancer.
  trieur:
    profiles: ["tri-ancien"]
    build: ./trieur
    container_name: beta-trieur
    user: "${PUID:-1000}:${PGID:-1000}" # même propriétaire que tes fichiers du NAS
    environment:
      - TZ=${TZ:-Europe/Paris}
      - OLLAMA_URL=http://ollama:11434
      - TRI_MODELE=${TRI_MODELE:-qwen3.5:9b}
      - TRI_HEURES=${TRI_HEURES:-0-6} # automatique la nuit ; le jour, bouton « Préparer maintenant »
      - TRI_PROPOSITIONS=${TRI_PROPOSITIONS:-oui}
      - TRI_RANGEMENT=${TRI_RANGEMENT:-} # où ranger, ex : volume1/Document
      - TRI_IGNORER=${TRI_IGNORER:-} # jamais trié (l'installation de Bêta), séparés par « ; »
      # Notifications (fin d'un tri, propositions de la nuit, tri bloqué) : voir NOTIFICATIONS dans .env
      - NOTIFICATIONS=${NOTIFICATIONS:-}
      - TRI_LIEN=${TRI_LIEN:-}
      - HA_URL=${HA_URL:-http://host.docker.internal:8123}
      - HA_TOKEN=${HA_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/tri:/etat # propositions, journal, index : rien n'est écrit dans tes dossiers
      # Les volumes du NAS (/volume1 -> /nas/volume1…) : docker-compose.override.yml, écrit par l'installateur
    depends_on:
      - ollama
    restart: unless-stopped

  # Ponts Alexa (Matter, sans skill) et HomeKit (app Maison d'Apple) : les appareils de Home Assistant choisis
  # dans Bêta home › Alexa / HomeKit, chacun sa liste. Réseau « hôte » obligatoire (découverte locale) ;
  # Alexa a aussi besoin de l'IPv6 sur le réseau. Codes et QR d'appairage : dans Bêta home.
  ponts:
    build: ./ponts
    container_name: beta-ponts
    network_mode: host
    init: true
    environment:
      - BETA_URL=http://127.0.0.1:8800
      - BETA_TOKEN=${BETA_TOKEN}
      - BRIDGE_PORT=${ALEXA_PORT:-5540}
      - HOMEKIT_PORT=${HOMEKIT_PORT:-51826}
      - ALEXA=${ALEXA:-on} # « off » pour couper un des deux ponts
      - HOMEKIT=${HOMEKIT:-on}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./data/ponts:/data # appairages Alexa et HomeKit (à garder, sinon il faut réappairer)
    depends_on:
      - beta
    restart: unless-stopped

  # Bêta Tool : ta boîte à outils (téléchargeur, convertisseur, PDF, fichiers, notes, agenda, budget…).
  # Son propre site sur http://IP_DU_NAS:8080 (onglet « Bêta Tool » de la barre de Bêta), ses propres comptes.
  # Dossiers : BETA_TOOL_FICHIERS (tes fichiers) et BETA_TOOL_DONNEES (comptes, réglages, notes…), dans .env.
  beta-tool:
    build: ./tool
    container_name: beta-tool
    ports:
      - "8080:8080"
    volumes:
      - ${BETA_TOOL_FICHIERS:-/volume3/BetaTool}/Telechargements:/downloads
      - ${BETA_TOOL_FICHIERS:-/volume3/BetaTool}/Conversions:/converted
      - ${BETA_TOOL_FICHIERS:-/volume3/BetaTool}/PDF:/pdf
      - ${BETA_TOOL_FICHIERS:-/volume3/BetaTool}/Decompresses:/extracted
      - ${BETA_TOOL_FICHIERS:-/volume3/BetaTool}/Documents:/documents
      - ${BETA_TOOL_FICHIERS:-/volume3/BetaTool}/Photos:/photos
      - ${BETA_TOOL_FICHIERS:-/volume3/BetaTool}/Recus:/depots
      - ${BETA_TOOL_FICHIERS:-/volume3/BetaTool}/Telephones:/phones
      - ${BETA_TOOL_DONNEES:-/volume3/Docker/Beta-tool/data}:/data
      - ./tool/static/brand:/app/static/brand
    environment:
      - TZ=${TZ:-Europe/Paris}
      - WORKERS=2
      - CONVERT_WORKERS=2
      - MAX_UPLOAD_GB=20
      - MAX_EXTRACT_GB=50
      - JOB_TTL_HOURS=24
      - APP_PASSWORD=${APP_PASSWORD:-}
      - STORAGE_NAME=${STORAGE_NAME:-NAS}
      - EXTRA_ROOTS=${EXTRA_ROOTS:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - VAULT_URL=${VAULT_URL:-}
      - WHISPER_MODEL=${BETA_TOOL_WHISPER:-small}
      - VPN_PASSWORD=${VPN_PASSWORD:-}
      - MS_CLIENT_ID=${MS_CLIENT_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Paperasse › Sur le NAS : les volumes du NAS sont montés dans /nas (docker-compose.override.yml, écrit par l'installateur)
      - PAPERASSE_IGNORER=${PAPERASSE_IGNORER:-}
      - PAPERASSE_IA_URL=http://ollama:11434 # l'IA locale aide pour les papiers que les mots-clés ne reconnaissent pas
      - PAPERASSE_IA_MODELE=${TRI_MODELE:-qwen3.5:9b}
      # Home Assistant : notifications (colis, rendez-vous, tâches, échéances…) et capteurs sensor.beta_tool_*
      - HA_URL=${HA_URL:-http://host.docker.internal:8123}
      - HA_TOKEN=${HA_TOKEN:-}
      - NOTIFICATIONS=${NOTIFICATIONS:-} # mêmes destinations que Bêta (Home Assistant, bot Discord, SMS…)
      - BETA_TOKEN=${BETA_TOKEN} # pour envoyer au bot Discord
      - HA_COMPTE=${BETA_TOOL_COMPTE:-}
      - BETA_TOOL_LIEN=${BETA_TOOL_LIEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # pour joindre Home Assistant
    restart: unless-stopped

  # Options de Bêta Tool, à ajouter dans COMPOSE_PROFILES (.env) : work, vault, vpn
  # Bêta Work : éditeur ONLYOFFICE Docs (≈ 2 à 4 Go de RAM)
  onlyoffice:
    image: onlyoffice/documentserver:8.3.3
    container_name: beta-work
    profiles: ["work"]
    ports:
      - "8081:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - ${BETA_TOOL_DONNEES:-/volume3/Docker/Beta-tool/data}/../onlyoffice:/var/www/onlyoffice/Data
    restart: unless-stopped

  # Coffre : gestionnaire de mots de passe Vaultwarden (adresse en HTTPS obligatoire, voir tool/README.md)
  vaultwarden:
    image: vaultwarden/server:1.32.7
    container_name: vaultwarden
    profiles: ["vault"]
    ports:
      - "8082:80"
    environment:
      - DOMAIN=${VAULT_URL:-}
      - SIGNUPS_ALLOWED=${VAULT_SIGNUPS:-true}
      - ADMIN_TOKEN=${VAULT_ADMIN_TOKEN:-}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${BETA_TOOL_DONNEES:-/volume3/Docker/Beta-tool/data}/vault:/data
    restart: unless-stopped

  # VPN WireGuard (wg-easy) : ouvre le port UDP 51820 de ta box vers le NAS
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:13
    container_name: wg-easy
    profiles: ["vpn"]
    environment:
      - WG_HOST=${VPN_HOST:-}
      - PASSWORD=${VPN_PASSWORD:-}
      - WG_DEFAULT_DNS=1.1.1.1
      - LANG=fr
    volumes:
      - ${BETA_TOOL_DONNEES:-/volume3/Docker/Beta-tool/data}/vpn:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  # Sauvegarde chaque nuit (SAUVEGARDE_HEURE) : réglages, appairages Alexa/HomeKit, données de Bêta, du tri,
  # configuration de Home Assistant et données de Bêta Tool, dans SAUVEGARDE_DOSSIER (gardée SAUVEGARDE_JOURS jours).
  # Tout de suite : docker exec beta-sauvegarde sh /sauvegarde.sh maintenant
  sauvegarde:
    image: alpine:3.20
    container_name: beta-sauvegarde
    command: ["sh", "/sauvegarde.sh"]
    environment:
      - TZ=${TZ:-Europe/Paris}
      - SAUVEGARDE_HEURE=${SAUVEGARDE_HEURE:-03:30}
      - SAUVEGARDE_JOURS=${SAUVEGARDE_JOURS:-14}
    volumes:
      - ./outils/sauvegarde.sh:/sauvegarde.sh:ro
      - ./.env:/source/env/.env:ro
      - ./config:/source/config:ro
      - ./data:/source/beta-nas:ro
      - ${BETA_TOOL_DONNEES:-/volume3/Docker/Beta-tool/data}:/source/beta-tool:ro
      - ${SAUVEGARDE_DOSSIER:-./data/sauvegardes}:/sauvegardes
    restart: unless-stopped

  # Bot Discord de Bêta (COMPOSE_PROFILES=…,discord) : commandes /beta, /maison, /camera, /colis, /agenda, /courses,
  # /energie, /telecharger, /envoyer… et les notifications dans un salon (« discord-bot » dans NOTIFICATIONS).
  discord:
    profiles: ["discord"]
    build: ./discord
    container_name: beta-discord
    environment:
      - TZ=${TZ:-Europe/Paris}
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - DISCORD_SALON=${DISCORD_SALON:-}
      - DISCORD_UTILISATEURS=${DISCORD_UTILISATEURS:-}
      - BETA_URL=http://beta:8800
      - BETA_TOKEN=${BETA_TOKEN}
      - BETA_TOOL_URL=http://beta-tool:8080
      - BETA_TOOL_JETON=${BETA_TOOL_JETON:-}
      - BETA_TOOL_LIEN=${BETA_TOOL_LIEN:-}
    depends_on:
      - beta
    restart: unless-stopped

  # Photos du téléphone, gratuit et open source (COMPOSE_PROFILES=…,photos) : Immich, comme Google Photos, chez toi.
  # Appli « Immich » (iPhone et Android) : sauvegarde automatique en arrière-plan. Page : http://IP_DU_NAS:2283
  immich-server:
    profiles: ["photos"]
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.4.2}
    volumes:
      - ${IMMICH_PHOTOS:-./data/immich/photos}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Paris}
      - DB_HOSTNAME=immich-database
      - DB_USERNAME=postgres
      - DB_PASSWORD=${IMMICH_DB_MOT_DE_PASSE:-postgres}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    ports:
      - "2283:2283"
    depends_on:
      - immich-redis
      - immich-database
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    profiles: ["photos"]
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.4.2}
    volumes:
      - ./data/immich/modeles:/cache
    environment:
      - TZ=${TZ:-Europe/Paris}
      - MACHINE_LEARNING_MODEL_REVISION=v2
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-redis:
    profiles: ["photos"]
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  immich-database:
    profiles: ["photos"]
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_MOT_DE_PASSE:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: "HDD" # disques durs du NAS
    volumes:
      - ./data/immich/postgres:/var/lib/postgresql/data # disque local du NAS (pas de partage réseau)
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
