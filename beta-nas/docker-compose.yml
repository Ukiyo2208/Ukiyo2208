# Bêta IA : toute la partie technique, sur le NAS.
# La tablette n'envoie que l'audio de la commande + le nom de la personne reconnue.

name: beta-nas # nom fixe : le réseau « beta-nas_default » est toujours le même

services:
  # Domotique, automatisations, musique (via Music Assistant)
  # Installé seulement si COMPOSE_PROFILES=homeassistant dans .env. Si tu as déjà ton propre
  # Home Assistant, laisse COMPOSE_PROFILES vide et mets son adresse dans HA_URL.
  homeassistant:
    profiles: ["homeassistant"]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host # nécessaire pour découvrir les appareils du réseau
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Paris}
    restart: unless-stopped

  # Parole -> texte
  whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: beta-whisper
    command: --model ${WHISPER_MODEL:-small-int8} --language fr
    ports:
      - "127.0.0.1:10300:10300" # accessible seulement depuis le NAS (Home Assistant inclus)
    volumes:
      - ./data/whisper:/data
    restart: unless-stopped

  # Texte -> voix
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: beta-piper
    command: --voice ${PIPER_VOICE:-fr_FR-siwis-medium}
    ports:
      - "127.0.0.1:10200:10200"
    volumes:
      - ./data/piper:/data
    restart: unless-stopped

  # Petit LLM local (tri des demandes que Home Assistant ne comprend pas)
  ollama:
    image: ollama/ollama:latest
    container_name: beta-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped

  # Qui est où : reconnaît les visages quand une caméra Reolink détecte quelqu'un
  presence:
    build: ./presence
    container_name: beta-presence
    env_file: .env
    environment:
      - BETA_CONFIG=/config/config.yaml
    ports:
      - "8801:8801" # page /docs pour enregistrer un visage depuis une caméra
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
      - ./data/presence:/data # base des visages (empreintes uniquement, aucune image)
    restart: unless-stopped

  # Le cerveau : reçoit les demandes de la tablette et choisit qui les traite
  beta:
    build: ./beta
    container_name: beta
    env_file: .env
    environment:
      - BETA_CONFIG=/config/config.yaml
      - WHISPER_HOST=whisper
      - PIPER_HOST=piper
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "8800:8800" # la tablette appelle http://IP_DU_NAS:8800
    extra_hosts:
      - "host.docker.internal:host-gateway" # pour joindre Home Assistant (réseau host)
    volumes:
      - ./config:/config:ro
      - ./data/beta:/data # ce que Bêta enregistre (appareils partagés avec Alexa…)
    depends_on:
      - whisper
      - piper
      - ollama
      - presence
      - trieur
    restart: unless-stopped

  # Tri des documents : propose titre, dossier et tags, et ne range qu'après ta validation.
  # Page : http://IP_DU_NAS:8800/tri/ (servie par Bêta ; le trieur n'est pas joignable directement)
  trieur:
    build: ./trieur
    container_name: beta-trieur
    user: "${PUID:-1000}:${PGID:-1000}" # même propriétaire que tes fichiers du NAS
    environment:
      - TZ=${TZ:-Europe/Paris}
      - OLLAMA_URL=http://ollama:11434
      - TRI_MODELE=${TRI_MODELE:-qwen3.5:9b}
      - TRI_HEURES=${TRI_HEURES:-0-6} # automatique la nuit ; le jour, bouton « Préparer maintenant »
      - TRI_PROPOSITIONS=${TRI_PROPOSITIONS:-oui}
      - TRI_RANGEMENT=${TRI_RANGEMENT:-} # où ranger, ex : volume1/Document
      - TRI_IGNORER=${TRI_IGNORER:-} # jamais trié (l'installation de Bêta), séparés par « ; »
      # Notifications (fin d'un tri, propositions de la nuit, tri bloqué) : voir NOTIFICATIONS dans .env
      - NOTIFICATIONS=${NOTIFICATIONS:-}
      - TRI_LIEN=${TRI_LIEN:-}
      - HA_URL=${HA_URL:-http://host.docker.internal:8123}
      - HA_TOKEN=${HA_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/tri:/etat # propositions, journal, index : rien n'est écrit dans tes dossiers
      # Les volumes du NAS (/volume1 -> /nas/volume1…) : docker-compose.override.yml, écrit par l'installateur
    depends_on:
      - ollama
    restart: unless-stopped

  # Pont Alexa (Matter) : les appareils de Home Assistant choisis dans Bêta home › Alexa apparaissent dans
  # Alexa, sans skill ni compte. Réseau « hôte » obligatoire (découverte Matter) et IPv6 activée sur le réseau.
  # Appairage : appli Alexa › Ajouter un appareil › Matter, avec le QR code affiché dans Bêta home.
  alexa:
    build: ./alexa
    container_name: beta-alexa
    network_mode: host
    init: true
    environment:
      - BETA_URL=http://127.0.0.1:8800
      - BETA_TOKEN=${BETA_TOKEN}
      - BRIDGE_PORT=${ALEXA_PORT:-5540}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./data/alexa:/data # appairage avec Alexa (ne pas supprimer, sinon il faut réappairer)
    depends_on:
      - beta
    restart: unless-stopped
