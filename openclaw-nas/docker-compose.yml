# OpenClaw sur le NAS UGREEN (UGOS Pro), branché sur l'Ollama de Bêta (beta-nas).
# Adapté du docker-compose.yml officiel d'OpenClaw, avec l'image pré-construite
# (pas de compilation sur le NAS) et les données dans ./data.

x-openclaw-commun: &commun
  image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
  env_file: .env
  environment: &env
    HOME: /home/node
    OPENCLAW_HOME: /home/node
    TERM: xterm-256color
    OPENCLAW_STATE_DIR: /home/node/.openclaw
    OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
    OPENCLAW_CONFIG_DIR: /home/node/.openclaw
    OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    OPENCLAW_GATEWAY_PORT: "18789"
    OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    TZ: ${OPENCLAW_TZ:-Europe/Paris}
  volumes:
    # Le conteneur tourne avec l'utilisateur 1000 : sudo chown -R 1000:1000 ./data
    - ./data/config:/home/node/.openclaw
    - ./data/workspace:/home/node/.openclaw/workspace
    - ./data/secrets:/home/node/.config/openclaw
    # Tes documents, en LECTURE SEULE : OpenClaw ne peut ni modifier ni supprimer un fichier
    - ${DOCUMENTS:-/volume1/Documents}:/home/node/.openclaw/workspace/documents:ro
    # Le seul endroit où OpenClaw écrit : ses propositions de tri
    - ${DOCUMENTS:-/volume1/Documents}/_A_TRIER/_traitement/propositions:/home/node/.openclaw/workspace/propositions
  cap_drop:
    - NET_RAW
    - NET_ADMIN
  security_opt:
    - no-new-privileges:true
  init: true

services:
  openclaw-gateway:
    <<: *commun
    container_name: openclaw
    networks:
      - defaut
      - beta # pour joindre l'Ollama de Bêta à l'adresse http://beta-ollama:11434
    ports:
      - "18789:18789" # interface web : http://IP_DU_NAS:18789
    restart: unless-stopped
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Outil en ligne de commande (configuration, appairage du navigateur…), lancé à la demande :
  #   sudo docker compose run --rm openclaw-cli <commande>
  openclaw-cli:
    <<: *commun
    network_mode: "service:openclaw-gateway"
    environment:
      <<: *env
      BROWSER: echo
    stdin_open: true
    tty: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway
    profiles: ["cli"]

  # Extrait le texte des documents à trier et range ceux que tu as validés (seul à déplacer des fichiers)
  trieur:
    build: ./trieur
    container_name: openclaw-trieur
    user: "${PUID:-1000}:${PGID:-1000}" # même propriétaire que tes fichiers du NAS
    environment:
      DOCUMENTS: /documents
      TZ: ${OPENCLAW_TZ:-Europe/Paris}
    volumes:
      - ${DOCUMENTS:-/volume1/Documents}:/documents
    networks:
      - defaut
    restart: unless-stopped

networks:
  defaut: {}
  beta:
    # Réseau créé par le projet beta-nas. Vérifie son nom avec : sudo docker network ls
    external: true
    name: ${BETA_RESEAU:-beta-nas_default}
