<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidéos → NAS</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --accent:#e62117; --border:#d2d2d7; --ok:#1a8f3c; --err:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111113; --card:#1c1c1f; --text:#f2f2f2; --muted:#9a9aa0; --border:#333338; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:20px; }
  textarea, input { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin:14px 0; align-items:center; }
  .seg { display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .seg label { padding:8px 14px; cursor:pointer; }
  .seg input { display:none; }
  .seg label:has(input:checked) { background:var(--accent); color:#fff; }
  .row input[type=text] { flex:1; min-width:180px; }
  button { width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  .msg { margin-top:10px; color:var(--err); min-height:1.5em; }
  .job { padding:12px 0; border-top:1px solid var(--border); }
  .job:first-child { border-top:0; }
  .title { font-weight:600; word-break:break-word; }
  .meta { color:var(--muted); font-size:.9rem; }
  .bar { height:6px; background:var(--border); border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar div { height:100%; background:var(--accent); transition:width .4s; }
  .done .bar div { background:var(--ok); }
  .error .meta { color:var(--err); }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Vidéos → NAS</h1>
  <p class="sub">Colle un ou plusieurs liens (YouTube, Vimeo, TikTok, X, Instagram, SoundCloud, Twitch… vidéo ou playlist). Téléchargement en meilleure qualité disponible, directement sur le NAS.</p>

  <form class="card" id="form">
    <textarea id="url" placeholder="https://…  (un lien par ligne)" required></textarea>
    <div class="row">
      <div class="seg">
        <label><input type="radio" name="mode" value="video" checked> Vidéo</label>
        <label><input type="radio" name="mode" value="audio"> Audio seul</label>
      </div>
      <input type="text" id="subfolder" placeholder="Sous-dossier (optionnel)">
    </div>
    <button id="go">Télécharger sur le NAS</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="card">
    <h2 style="margin:0 0 8px;font-size:1.1rem">Téléchargements</h2>
    <div id="jobs"><div class="empty">Aucun téléchargement pour l’instant.</div></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const labels = { queued:"En attente", starting:"Démarrage…", downloading:"Téléchargement", processing:"Fusion / conversion…", done:"Terminé ✔", error:"Erreur" };

// Pré-remplit avec le presse-papier si c'est un lien
$("url").addEventListener("focus", async () => {
  if ($("url").value) return;
  try {
    const t = await navigator.clipboard.readText();
    if (/^https?:\/\//.test(t.trim())) $("url").value = t.trim();
  } catch {}
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true; $("msg").textContent = "";
  try {
    const r = await fetch("/api/download", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value, mode: document.querySelector("[name=mode]:checked").value, subfolder: $("subfolder").value })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Erreur");
    $("url").value = "";
    refresh();
  } catch (err) { $("msg").textContent = err.message; }
  $("go").disabled = false;
});

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function refresh() {
  try {
    const jobs = await (await fetch("/api/jobs")).json();
    if (!jobs.length) return;
    $("jobs").innerHTML = jobs.map(j => {
      const pct = j.status === "done" ? 100 : (j.progress || 0);
      let meta = labels[j.status] || j.status;
      if (j.status === "downloading") meta += ` · ${j.progress ?? "?"}% ${j.speed ? "· " + j.speed : ""} ${j.eta ? "· reste " + j.eta : ""}`;
      if (j.error) meta += " — " + j.error;
      meta += ` · ${j.mode === "audio" ? "Audio" : "Vidéo"}${j.subfolder ? " → " + j.subfolder : ""}`;
      return `<div class="job ${j.status}"><div class="title">${esc(j.title)}</div><div class="meta">${esc(meta)}</div><div class="bar"><div style="width:${pct}%"></div></div></div>`;
    }).join("");
  } catch {}
}
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
