services:
  yt-nas:
    build: .
    container_name: yt-nas
    ports:
      - "8080:8080"
    volumes:
      # Remplace le chemin de gauche par le dossier partagé de ton NAS
      # Synology : /volume1/video/YouTube   — QNAP : /share/Multimedia/YouTube
      - /volume1/video/YouTube:/downloads
    environment:
      - WORKERS=2
      # Optionnel : propriétaire des fichiers (voir `id` sur le NAS)
    # user: "1026:100"
    restart: unless-stopped
